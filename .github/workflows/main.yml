name: Build & Release hezhijie0327/NanoKVM-USB-CFWorkers

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Checkout
        uses: actions/checkout@v6
      - name: Step 2 - Build NanoKVM-USB-CFWorkers
        run: |
          git clone --depth 1 -b "main" "https://github.com/sipeed/NanoKVM-USB" "/tmp/NanoKVM-USB"
          rm -rf /tmp/NanoKVM-USB/browser/pnpm-*.yaml
          rsync -av --delete --exclude='.git' --exclude='.github' --exclude='AGENTS.md' --exclude='LICENSE' --exclude='wrangler.jsonc' --exclude='patch' /tmp/NanoKVM-USB/browser/ ./
      - name: Step 2.5 - Apply patches
        run: |
          if [ -d "patch" ] && [ -n "$(ls -A patch/*.patch 2>/dev/null)" ]; then
            for p in patch/*.patch; do
              git apply --reject "$p" || true
            done
          fi
      - name: Step 3 - Release NanoKVM-USB-CFWorkers
        run: |
          curl -s "https://raw.githubusercontent.com/hezhijie0327/Toolkit/main/Git.sh" > "/tmp/Git.sh"
          sudo bash "/tmp/Git.sh" -u "hezhijie0327" -e "hezhijie0327@hotmail.com" -f "." -r "NanoKVM-USB-CFWorkers" -i "Synced by GitHub Actions" -m "push"
